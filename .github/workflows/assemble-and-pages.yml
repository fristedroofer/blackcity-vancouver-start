name: Assemble binaries and enable Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: assemble-and-pages
  cancel-in-progress: false

jobs:
  assemble-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Add binary game assets.'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Decode staged binaries, verify checksums, and commit
        run: |
          set -euo pipefail
          if [ ! -d .build-staging ]; then
            echo "No .build-staging directory; using files already on the branch."
            exit 0
          fi

          python3 << 'PY'
          import base64, pathlib, sys
          root = pathlib.Path(".")
          stage = root / ".build-staging"
          chunks_dir = stage / "wasm-chunks"
          if chunks_dir.exists():
              chunks = sorted(chunks_dir.glob("index.wasm.b64.*"))
              if chunks:
                  wasm_b64 = b"".join(p.read_bytes() for p in chunks)
                  (root / "index.wasm").write_bytes(base64.b64decode(wasm_b64))
                  print("decoded wasm from", len(chunks), "chunks")
          other = stage / "other"
          if other.exists():
              for src in sorted(other.glob("*.b64")):
                  dest = root / src.name[:-4]
                  dest.write_bytes(base64.b64decode(src.read_bytes()))
                  print("decoded", dest.name)
          if not (root / "index.wasm").exists() or not (root / "index.pck").exists():
              sys.exit("missing index.wasm or index.pck after assemble")
          print("decoded files ok")
          PY

          sha256sum -c .build-staging/SHA256SUMS
          rm -rf .build-staging

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Add binary game assets."
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
