name: Assemble binaries and enable Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: assemble-and-pages
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Add binary game assets.'
    steps:
      - uses: actions/checkout@v4

      - name: Decode staged binaries, verify checksums, and commit
        run: |
          set -euo pipefail
          if [ ! -d .build-staging ]; then
            echo "No .build-staging directory; binaries should already be present."
            exit 0
          fi

          python3 << 'PY'
          import base64, pathlib, sys
          root = pathlib.Path(".")
          stage = root / ".build-staging"
          chunks = sorted((stage / "wasm-chunks").glob("index.wasm.b64.*"))
          if not chunks:
              sys.exit("missing wasm chunks")
          wasm_b64 = b"".join(p.read_bytes() for p in chunks)
          (root / "index.wasm").write_bytes(base64.b64decode(wasm_b64))
          other = stage / "other"
          for src in sorted(other.glob("*.b64")):
              dest = root / src.name[:-4]
              dest.write_bytes(base64.b64decode(src.read_bytes()))
          print("decoded files ok")
          PY

          sha256sum -c .build-staging/SHA256SUMS
          rm -rf .build-staging

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.wasm index.pck index.icon.png index.png \
            index.144x144.png index.180x180.png index.512x512.png \
            index.apple-touch-icon.png
          git add -A .build-staging
          git status
          git commit -m "Add binary game assets."
          git push

  enable-pages:
    runs-on: ubuntu-latest
    needs: [assemble]
    if: always() && (needs.assemble.result == 'success' || needs.assemble.result == 'skipped')
    steps:
      - name: Enable GitHub Pages from main / root
        run: |
          set +e
          body='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages_out -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d "$body")
          echo "POST /pages -> $code"
          cat /tmp/pages_out
          echo
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            code=$(curl -sS -o /tmp/pages_out -w "%{http_code}" \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d '{"source":{"branch":"main","path":"/"}}')
            echo "PUT /pages -> $code"
            cat /tmp/pages_out
            echo
          fi
          code=$(curl -sS -o /tmp/pages_out -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "GET /pages -> $code"
          cat /tmp/pages_out
          echo
          if [ "$code" != "200" ]; then
            echo "Could not enable or read GitHub Pages."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
